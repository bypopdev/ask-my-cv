name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Terraform apply
        working-directory: infra
        env:
          # A secret, so the address is masked in the public Terraform plan output.
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_region: ${{ vars.AWS_REGION || 'eu-central-1' }}
          TF_VAR_bedrock_region: ${{ vars.BEDROCK_REGION || 'eu-central-1' }}
          TF_VAR_model_id: ${{ vars.MODEL_ID || 'anthropic.claude-haiku-5-5' }}
          # Optional Claude API backup for when Bedrock fails; leave the secret unset to disable it.
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_anthropic_model_id: ${{ vars.ANTHROPIC_MODEL_ID || 'claude-haiku-5-5' }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve
          echo "SITE_URL=$(terraform output -raw site_url)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(terraform output -raw distribution_id)" >> "$GITHUB_ENV"
      - name: Refresh CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" > /dev/null
      - run: echo "Deployed to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
